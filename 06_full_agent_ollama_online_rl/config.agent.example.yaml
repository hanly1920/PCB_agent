llm:
  provider: ollama        # ollama | openai | mock | disabled
  endpoint: http://localhost:11434
  model: qwen3:8b
  temperature: 0.1
placement:
  checkpoint_path: <path-to-checkpoint>/train-floorplan-mixed-b3_3-reply20.pt
  device: cuda
  mock: false
  strict_state_dict: true
  beam_width: 1
  beam_topk: 16
  layout_preset: checkpoint
online_finetune:
  enabled: true
  default_policy_updates: 1
  learning_rate: 0.00001
  replay_batch_size: 2
  replay_update_steps: 4
  replay_rollouts_per_iter: 8
  replay_policy_gradient_coef: 1.0
  replay_action_ce_coef: 0.1
  replay_entropy_coef: 0.01
  replay_baseline_beta: 0.9
  replay_advantage_clip: 1.0
  replay_pg_policy_mode: shaped
  expert_snap_radius: 6
  expert_snap_global_fallback: true
  save_subdir: online_checkpoints
router:
  mode: freerouting      # freerouting | none | mock
  java_bin: java
  freerouting_jar: tools/freerouting.jar
  passes: 50
  threads: 8
  timeout_sec: 1800
  # Adapter commands are argv arrays; placeholders: {board} {dsn} {ses} {output_board}
  export_dsn_cmd: []
  import_ses_cmd: []
kicad:
  cli: kicad-cli
  drc_timeout_sec: 600
  mock_drc: false
workflow:
  run_routing: true
  run_drc: true
  auto_skip_unavailable_tools: true
  accept_placement_without_drc: true
  require_drc_clean: false
  export_best_effort_board: true
  llm_tuning_enabled: true
  min_optimization_rounds: 2
  allow_llm_accept: true
max_rounds: 3
